<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Login</title>
    <style>
      *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
      }
        body{
            min-height: 100vh;
            background-image: url('c756dbb647eaf3666a43286ed3828e00.jpg') ;
            background-size: cover;
            background-position: center;
            font-family: Arial;
            display: flex;
            justify-content: center;
            margin-top: 100px;
        }
        .kotak{
            background-color: rgba(212, 232, 226, 0.9); 
            padding: 25px;
            width: 300px;
            border-radius: 5px;
        }
        .kotak h2{
            margin-top: 0;
        }
        input{
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button{
            width: 100%;
            background-color: #818483;
            color: white;
            border: none;
            padding: 8px;
            margin-top: 10px;
            cursor: pointer;
        }
        a{
            color: #818483;
            font-size: 13px;
        }
        p{
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="kotak">
        <h2>Form Login</h2>
        <input type="text" placeholder="Masukkan email">
        <input type="password" placeholder="Masukkan password">
        <a href="#">Lupa Password ?</a><br><br>
        <button>Login</button>
        <p>Belum punya akun? <a href="registrasi1.html">Daftar.</a></p>
    </div>
</body>
</html>
