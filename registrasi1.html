<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            background-image: url('c756dbb647eaf3666a43286ed3828e00.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .kotak{
            background-color: rgba(212, 232, 226, 0.92);
            padding: 30px;
            width: 340px;
            max-width: 90%;
            border-radius: 8px;
        }
        .kotak h2{
            margin-bottom: 20px;
            font-size: 24px;
        }
        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 14px;
        }
        button{
            width: 100%;
            background-color: #0a6b4a;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        p{
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
        }
        a{
            color: #0a6b4a;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="kotak">
        <h2>Form Registrasi</h2>
        <input type="text" placeholder="Masukkan email">
        <input type="password" placeholder="Masukkan password">
        <input type="password" placeholder="Masukkan ulang password">
        <button>Daftar</button>
        <p>sudah punya akun? <a href="login.html">Login</a></p>
    </div>
</body>
</html>
